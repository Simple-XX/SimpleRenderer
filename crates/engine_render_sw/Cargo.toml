[package]
name = "engine_render_sw"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"

[dependencies]
glam = "0.29"
tobj = "4.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
rayon = "1.10"
log = "0.4"
thiserror = "2"

[dev-dependencies]
env_logger = "0.11"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "render_bench"
harness = false
